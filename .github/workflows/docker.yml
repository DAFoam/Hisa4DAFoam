name: docker

on:
  push:
    branches:
      - main

env:
  DOCKER_ENV_FILE: '/home/dockeruser/dafoam/loadDAFoam.sh'

jobs:
  push_to_registry:
    name: Deploy
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Build and push
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u dafoam --password-stdin
        docker pull dafoam/opt-packages:latest
        docker run -i -d -u dockeruser --name build_latest dafoam/opt-packages:latest /bin/bash
        docker exec -i build_latest /bin/bash -c ". ${{env.DOCKER_ENV_FILE}} && cd /home/dockeruser/dafoam/OpenFOAM && rm -rf Hisa4DAFoam && git clone https://github.com/DAFoam/Hisa4DAFoam.git && cd Hisa4DAFoam && ./Allmake && rm -rf src/Make/linux64* .git"
        docker export build_latest | docker import - dafoam/opt-packages:latestnew
        docker rm -f $(docker ps -a -q)
        docker rmi -f dafoam/opt-packages:latest
        docker tag dafoam/opt-packages:latestnew dafoam/opt-packages:latest
        docker push dafoam/opt-packages:latest
